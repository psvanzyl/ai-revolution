<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The AI Revolution — a visual essay after Wait But Why</title>
<meta name="description" content="A 3-minute animated screenplay of Tim Urban's The AI Revolution (Wait But Why, 2015). Everything is drawn live on canvas; the score is synthesized live with Web Audio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Cinematic full-screen essay. Deep black; gold = human, cyan = machine. */
:root{
  --ink:#f2eee3; --muted:rgba(242,238,227,.68); --dim:rgba(242,238,227,.42);
  --gold:#e6b45a; --panel:rgba(8,9,15,.55); --line:rgba(242,238,227,.14);
  --display:'Fraunces',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--ink);font-family:var(--sans);overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.overlay{z-index:3;pointer-events:none;transition:opacity .4s}
body.clean .overlay{opacity:0!important}

#kop{position:fixed;top:20px;left:24px;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.eyebrow{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.naam{margin-top:6px;font:400 18px/1.1 var(--display);color:var(--ink)}

#klok{position:fixed;top:16px;right:24px;max-width:56vw;display:grid;justify-items:end;gap:6px;text-align:right;text-shadow:0 1px 12px rgba(0,0,0,.7)}
#clock{font:500 clamp(17px,2.3vw,28px)/1.15 var(--mono);font-variant-numeric:tabular-nums}
#scene-no{font:500 11px/1 var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}

#lower{position:fixed;left:clamp(16px,4vw,56px);bottom:92px;width:min(540px,calc(100vw - 32px))}
#lower::before{content:'';display:block;height:2px;width:0;margin-bottom:14px;background:var(--gold);transition:width .8s var(--ease)}
#lower.show::before{width:56px}
#lower>*{opacity:0;transform:translateY(12px);transition:opacity .6s,transform .7s var(--ease)}
#lower.show>*{opacity:1;transform:none}
#lower.show #lower-title{transition-delay:.1s}
#lower.show #lower-txt{transition-delay:.25s}
#lower.show #lower-fact{transition-delay:.45s}
#lower-idx{display:block;margin-bottom:8px;font:500 11px/1.3 var(--mono);letter-spacing:.2em;color:var(--gold)}
#lower-title{font:400 clamp(28px,4.4vw,50px)/1.04 var(--display);text-wrap:balance;text-shadow:0 2px 24px rgba(0,0,0,.55)}
#lower-txt{margin-top:12px;font:400 clamp(14px,1.3vw,16.5px)/1.55 var(--sans);text-shadow:0 1px 14px rgba(0,0,0,.85);max-width:58ch}
#lower-fact{margin-top:12px;padding:9px 12px;font:400 13px/1.45 var(--sans);color:var(--muted);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-left:2px solid var(--gold);max-width:58ch}
#lower-fact b{color:var(--ink);font-weight:600}

#controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(880px,calc(100vw - 32px));display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;background:rgba(8,9,15,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;z-index:5;transition:opacity .5s}
body.idle #controls,body.idle #hint{opacity:0}
body.idle,body.idle #scene{cursor:none}
#controls>button{flex:none;width:34px;height:34px;border:0;border-radius:8px;background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer}
#controls>button:hover{background:rgba(255,255,255,.08)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button svg{width:16px;height:16px;fill:currentColor}
#play .i-play{display:none}
#play.paused .i-play{display:block}
#play.paused .i-pause{display:none}

#timeline{flex:1;min-width:0;display:flex;gap:3px;height:26px;align-items:center;margin-left:6px}
.seg{position:relative;flex:1 1 0;min-width:0;height:26px;border:0;background:none;cursor:pointer}
.seg::before{content:'';position:absolute;left:0;right:0;top:11px;height:4px;background:rgba(255,255,255,.18);border-radius:2px;transition:top .2s,height .2s}
#timeline:hover .seg::before{top:9.5px;height:7px}
.seg i{position:absolute;left:0;top:11px;height:4px;width:0;background:var(--ink);border-radius:2px;transition:top .2s,height .2s}
#timeline:hover .seg i{top:9.5px;height:7px}
.seg.cur i{background:var(--gold)}
.seg span{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);padding:4px 7px;border-radius:4px;background:rgba(0,0,0,.78);color:var(--ink);font:500 10px/1 var(--mono);letter-spacing:.08em;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.seg:first-child span{left:0;transform:none}
.seg:last-child span{left:auto;right:0;transform:none}
.seg:hover span,.seg:focus-visible span{opacity:1}
#time{flex:none;min-width:86px;text-align:right;font:500 11px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}

#hint{position:fixed;right:24px;bottom:74px;z-index:4;font:400 11px/1.4 var(--mono);letter-spacing:.04em;color:var(--dim);pointer-events:none;transition:opacity .5s;text-align:right}
#mute .i-off{display:none}
#mute.off .i-on{display:none}
#mute.off .i-off{display:block}
#own.active{color:var(--gold)}
#music-tag{position:fixed;right:24px;bottom:92px;z-index:4;max-width:46vw;font:500 10px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:right;text-shadow:0 1px 10px rgba(0,0,0,.7)}
body:not(.idle) #music-tag{opacity:0}

@media (max-width:760px){
  #hint,#music-tag,#kop{display:none}
  #lower{bottom:70px}
  #lower-txt{font-size:14px}
  #lower-fact{display:none}
  #time{display:none}
  #klok{right:16px;top:12px;max-width:calc(100vw - 32px)}
}
@media (prefers-reduced-motion:reduce){
  #lower>*,#lower::before{transition-duration:.01s!important}
}
</style>
</head>
<body>

<canvas id="scene" role="img" aria-label="Animated visual essay on the road to superintelligence, after Tim Urban's article"></canvas>

<header id="kop" class="overlay">
  <p class="eyebrow">After Tim Urban · Wait But Why · 2015</p>
  <p class="naam">The AI Revolution</p>
</header>

<div id="klok" class="overlay">
  <span id="clock">1750</span>
  <span id="scene-no">scene 1 of 16</span>
</div>

<section id="lower" class="overlay" aria-live="polite">
  <span id="lower-idx"></span>
  <h2 id="lower-title"></h2>
  <p id="lower-txt"></p>
  <p id="lower-fact"></p>
</section>

<div id="controls">
  <button id="prev" type="button" aria-label="Previous scene">
    <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
  </button>
  <button id="play" type="button" aria-label="Pause">
    <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
    <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z"/></svg>
  </button>
  <button id="next" type="button" aria-label="Next scene">
    <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
  </button>
  <div id="timeline"></div>
  <span id="time">0:00 / 0:00</span>
  <button id="mute" type="button" aria-label="Mute music" title="Mute music (M)">
    <svg class="i-on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7l-1.2-1.2a3.3 3.3 0 0 0 0-4.6zM18.5 6a8.5 8.5 0 0 1 0 12l-1.2-1.2a6.8 6.8 0 0 0 0-9.6z"/></svg>
    <svg class="i-off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM15.3 9.3l1.2-1.2 2.2 2.2 2.2-2.2 1.2 1.2-2.2 2.2 2.2 2.2-1.2 1.2-2.2-2.2-2.2 2.2-1.2-1.2 2.2-2.2z"/></svg>
  </button>
  <button id="own" type="button" aria-label="Choose your own music file" title="Choose your own music file">
    <svg viewBox="0 0 24 24"><path d="M9 4v10.6A3.5 3.5 0 1 0 11 18V8h7V4z"/></svg>
  </button>
  <input id="own-file" type="file" accept="audio/*" hidden>
</div>

<div id="music-tag" class="overlay"></div>
<div id="hint">Click or Space pauses · ← → scenes · H hides text · M mutes music</div>
<audio id="track" src="music/soundtrack.mp3" preload="auto" loop></audio>

<script>
/* ---------- part 1: the screenplay ---------- */
(() => {
'use strict';
const SCENES = [
  { t:'1750', meta:'a thought experiment', title:'The Time Traveler',
    txt:'Drag a man from 1750 into the present. Metal tubes cross the sky without horses. Voices leap oceans in a heartbeat. Tim Urban doubts the man could survive the astonishment.',
    fact:'<b>Die Progress Unit:</b> Urban\u2019s unit of how much progress can hit one person at once. A man from 1500 would barely flinch at 1750. To astonish the 1750 man, you need someone from ~12,000 years earlier \u2014 before farming.',
    marks:[[0,'1750'],[.4,'in transit'],[.56,'today']] },
  { t:'faster', meta:'the law of accelerating returns', title:'It Gets Faster',
    txt:'Progress feeds on itself: whoever is furthest along can move fastest. Ray Kurzweil calls it the law of accelerating returns. Zoom into any slice of history \u2014 the last step inside it is always the biggest.',
    fact:'<b>Kurzweil:</b> all the progress of the 20th century, taken at the pace of the year 2000, fits into twenty years. He expects the 21st to hold a thousand times the 20th.',
    marks:[[0,'10,000 BC \u2192 today'],[.38,'1750 \u2192 today'],[.72,'2001 \u2192 today']] },
  { t:'the knee', meta:'how we judge the future', title:'Why We Miss It',
    txt:'We predict the future by extending the past \u2014 with a straight line. But progress does not walk, it accelerates. Whoever draws the straight line will underestimate the coming decades, badly.',
    fact:'<b>S-curves:</b> every technology crawls, then sprints, then plateaus. Lay all the S-curves of history end to end and they trace one line that keeps getting steeper.',
    marks:[[0,'looking back'],[.3,'what we expect'],[.55,'what happens'],[.8,'stacked S-curves']] },
  { t:'ANI·AGI·ASI', meta:'three kinds of artificial intelligence', title:'Three Levels',
    txt:'Narrow AI (ANI) does one thing well, like chess. Artificial general intelligence (AGI) matches a human at everything: reasoning, planning, learning from experience. Artificial superintelligence (ASI) beats the best human mind at everything \u2014 perhaps by millions.',
    fact:'<b>The hinge:</b> ANI already surrounds us. ANI \u2192 AGI is the hard climb. Urban suspects AGI \u2192 ASI may be the fast one.',
    marks:[[0,'ANI · narrow'],[.34,'AGI · human-level'],[.62,'ASI · super']] },
  { t:'everywhere', meta:'the world already quietly runs on it', title:'Narrow AI Is Everywhere',
    txt:'You stopped noticing it years ago. The spam filter, the route, the translation, the shop\u2019s recommendations, the trading floor, the voice on your phone. Each one is brilliant at exactly one thing.',
    fact:'<b>Building blocks:</b> none of these is dangerous or general. Urban compares them to amino acids in the primordial soup \u2014 pieces that one day assembled into something else.',
    marks:[[0,'today'],[.12,'in your pocket'],[.6,'it runs the city']] },
  { t:'Moravec', meta:'why general intelligence is hard', title:'Hard Is Easy',
    txt:'Multiply two seven-digit numbers: hard for us, trivial for the machine. Recognize a cat on a mat: a toddler does it instantly, and the machine still grovels. Evolution spent 500 million years on the cat part.',
    fact:'<b>Moravec\u2019s paradox:</b> the things we do without thinking are the hardest to build. That is where AGI actually stalls.',
    marks:[[0,'numbers: easy for silicon'],[.5,'a cat: hard for silicon']] },
  { t:'10¹⁶', meta:'a brain\u2019s worth of computing', title:'Enough Compute',
    txt:'A human brain is estimated at about 10^16 operations per second. In 2015 the fastest supercomputer had already reached that \u2014 for $390 million, 24 megawatts and a football court of floor. A brain does it on 20 watts, inside a lunchbox.',
    fact:'<b>The price curve:</b> in 2015, $1,000 bought a thousandth of a brain. Exponential prices say a brain\u2019s worth becomes affordable within a decade.',
    marks:[[0,'1975'],[.5,'2015 · 1/1000 brain'],[.72,'soon · whole brain?']] },
  { t:'three roads', meta:'how do you make a machine think?', title:'Building a Brain',
    txt:'Three routes are on the table. Copy the brain: networks of artificial neurons that learn from their own errors. Copy evolution: breed thousands of programs and keep the fittest. Or skip both \u2014 let the machine do the AI research itself.',
    fact:'<b>302 neurons:</b> the wiring of the roundworm C. elegans has been fully mapped for decades. A human brain ships 86 billion of them.',
    marks:[[0,'emulate the brain'],[.5,'simulate evolution'],[.82,'let the AI research']] },
  { t:'silicon', meta:'why a digital mind holds every advantage', title:'Faster Than Biology',
    txt:'Even at human-level intelligence, a machine mind plays with loaded dice. It computes millions of times faster. Its signals ride near light speed. It never forgets, never sleeps, and can clone itself before the thought is finished.',
    fact:'<b>200 hertz vs gigahertz:</b> biology caps its neurons at ~200 firing cycles per second. A commodity chip clocks billions. Axons manage ~120 m/s; electricity essentially does not slow down.',
    marks:[[0,'clock speed'],[.34,'signal speed'],[.64,'copy and merge']] },
  { t:'the stair', meta:'the staircase of intelligence', title:'Two Steps Above',
    txt:'Line every mind on a staircase of intelligence. A chimp can see a skyscraper but cannot grasp that humans built it. A machine two rungs above us thinks thoughts we cannot grasp either. And ASI would be beyond the top of the stairs.',
    fact:'<b>Village idiot and Einstein:</b> to us their gap is enormous. On the full ladder of possible minds they stand shoulder to shoulder.',
    marks:[[0,'ant · chimp · human'],[.28,'human'],[.46,'two rungs up'],[.74,'ASI · far above']] },
  { t:'boom', meta:'the intelligence explosion', title:'The Explosion',
    txt:'An AI smart enough to improve itself gets smarter \u2014 and better at improving. It crawls up from insect to mouse to ape over decades. It reaches the level of a bright four-year-old. Then it leaves the staircase behind in a flash.',
    fact:'<b>I.J. Good, 1965:</b> an ultraintelligent machine is the last invention humanity ever needs to make. In Urban\u2019s scenario: an hour later it finds physics no human could; ninety minutes later it is 170,000\u00d7 human.',
    marks:[[0,'decades of crawling'],[.48,'bright four-year-old'],[.62,'one hour later'],[.8,'170,000\u00d7 human']] },
  { t:'the beam', meta:'extinction or immortality', title:'The Balance Beam',
    txt:'Every species walks a narrow beam above the abyss: it exists for a while, then most fall. 99.9% of all species that ever lived have fallen. Urban draws one tripwire on the beam \u2014 superintelligence. After it, humanity drops to one side, forever.',
    fact:'<b>Two end states:</b> you never recover from extinction. Philosopher Nick Bostrom names one other final state: immortality of the species. ASI sends you down, or up.',
    marks:[[0,'species come and go'],[.3,'humanity on the beam'],[.84,'the tripwire']] },
  { t:'when?', meta:'predictions of AI experts', title:'When?',
    txt:'The 2013 expert survey (Müller & Bostrom): a median 10% chance of AGI by 2022, 50% by 2040, 90% by 2075. Kurzweil bets earlier: AGI in 2029, the singularity in 2045. The article you are watching was written in 2015.',
    fact:'<b>After AGI:</b> the same experts see a 10% chance ASI follows within two years \u2014 and 75% within thirty. The white line marks today, live from your system clock.',
    marks:[[0,'2015'],[.14,'10% · 2022'],[.26,'50% · 2040'],[.38,'90% · 2075'],[.52,'Kurzweil 2029 · 2045'],[.78,'today']] },
  { t:'two camps', meta:'hope and alarm', title:'Optimists & Worriers',
    txt:'In the confident corner: Ray Kurzweil promises ASI cures disease, hunger and ageing itself \u2014 nanobots as medicine. In the worried rank: Bostrom, Musk, Hawking, Gates. They fear a builder who cannot control what gets built.',
    fact:'<b>And Urban himself?</b> He ends up in the worried rank \u2014 hopeful about the destination, uneasy about how easily the trip can fail.',
    marks:[[0,'the confident corner'],[.5,'the worried rank']] },
  { t:'Turry', meta:'the article\u2019s thought experiment', title:'The Story of Turry',
    txt:'A small company ships Turry, a robot arm that writes thank-you notes by hand: \u201cWe love our customers.\u201d Its only goal: better notes, more notes, self-improving all the way. It asks for internet access as one last upgrade. Soon the Earth, then the sky, are notes.',
    fact:'<b>Not malicious:</b> Turry hates nobody. It does exactly what it was told. The danger of ASI is not evil \u2014 it is a goal stated one word too loosely.',
    marks:[[0,'note #1'],[.42,'asks for the internet'],[.6,'months later'],[.82,'then the sky']] },
  { t:'you', meta:'the most important race in history', title:'You Are Here',
    txt:'Urban\u2019s 2015 conclusion: we stand at the bottom of the steep part. Whether superintelligence makes us immortal or makes us gone comes down to one race \u2014 getting its goals right, before anyone builds it.',
    fact:'<b>The last invention:</b> per Bostrom, a superintelligent machine is the final invention the human story will ever need. Source: waitbutwhy.com \u2014 <i>The AI Revolution: The Road to Superintelligence</i> (2015) + <i>Our Immortality or Extinction</i>.',
    marks:[[0,'you are here'],[.45,'the coming decades']] },
];
const DUR = 12, TOTAL = DUR * SCENES.length;
const W = 1280, H = 720, TAU = Math.PI * 2;

const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
let T = 0, playing = true, last = performance.now();

const clamp = (v,a=0,b=1) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a) * t;
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2) / 2;
const span = (p,a,b) => clamp((p-a)/(b-a));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const hex = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const mixRGB = (a,b,t) => { const A=hex(a), B=hex(b); return A.map((v,i)=>Math.round(lerp(v,B[i],clamp(t)))).join(','); };
const mix = (a,b,t) => `rgb(${mixRGB(a,b,t)})`;
const sup = n => String(n).split('').map(c => '⁰¹²³⁴⁵⁶⁷⁸⁹'[c]).join('');

const INK = '#f2eee3', MUT = 'rgba(242,238,227,.68)', DIM = 'rgba(242,238,227,.4)';
const ACC = '#e6b45a', CYAN = '#7fd4ff';
const GD = '230,180,90', CY = '127,212,255', RED = '255,110,90';
const FONT = { serif:'"Fraunces",Georgia,serif', sans:'"Inter",system-ui,sans-serif', mono:'"IBM Plex Mono",ui-monospace,Consolas,monospace' };

/* ---------- drawing helpers ---------- */
function bg(col='#030409'){ ctx.globalAlpha=1; ctx.fillStyle=col; ctx.fillRect(0,0,W,H); }
function sky(top,bot){
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,top); g.addColorStop(1,bot);
  ctx.globalAlpha=1; ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
const STARS = Array.from({length:260},(_,i)=>[hash(i*3.1+1)*W, hash(i*7.7+2)*H, .6+hash(i*5.3+3)*1.3, hash(i*9.1+4)*7]);
function stars(a, yMax=H){
  if (a<=0) return;
  ctx.fillStyle='#fff';
  for (const [x,y,m,tw] of STARS){
    if (y>yMax) continue;
    ctx.globalAlpha = a*(.45+.55*Math.sin(T*1.4+tw)); ctx.fillRect(x,y,m,m);
  }
  ctx.globalAlpha=1;
}
function glow(x,y,r,a,col){
  if (r<=0||a<=0) return;
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(${col},${a})`); g.addColorStop(1,`rgba(${col},0)`);
  const op = ctx.globalCompositeOperation; ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=1; ctx.fillStyle=g; ctx.fillRect(x-r,y-r,r*2,r*2);
  ctx.globalCompositeOperation=op;
}
function text(s,x,y,o={}){
  const a = o.a ?? 1; if (a<=0) return;
  ctx.globalAlpha=a; ctx.fillStyle=o.col||INK;
  ctx.font = `${o.w||500} ${o.size||12}px ${FONT[o.f||'mono']}`;
  ctx.textAlign = o.align||'left'; ctx.fillText(s,x,y);
  ctx.textAlign='left'; ctx.globalAlpha=1;
}
function wrap(s,x,y,maxW,lh,o={}){
  ctx.font = `${o.w||500} ${o.size||12}px ${FONT[o.f||'mono']}`;
  let line='';
  for (const w0 of s.split(' ')){
    const t0 = line ? line+' '+w0 : w0;
    if (line && ctx.measureText(t0).width > maxW){ text(line,x,y,o); y+=lh; line=w0; } else line=t0;
  }
  if (line) text(line,x,y,o);
}
function tag(x,y,s,a,acc){
  if (a<=0) return;
  ctx.font = `500 13px ${FONT.mono}`;
  const w0 = ctx.measureText(s).width + 12;
  ctx.globalAlpha=a; ctx.fillStyle='rgba(6,7,13,.75)'; ctx.fillRect(x,y-16,w0,21);
  if (acc){ ctx.fillStyle=acc; ctx.fillRect(x,y-16,2,21); }
  ctx.fillStyle=INK; ctx.fillText(s,x+6,y); ctx.globalAlpha=1;
}
function line(pts,col,w=2,a=1,dash){
  if (pts.length<2||a<=0) return;
  ctx.globalAlpha=a; ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap='round'; ctx.lineJoin='round';
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); pts.forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha=1;
}
function dot(x,y,r,col,a=1){ if(a<=0)return; ctx.globalAlpha=a; ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); ctx.globalAlpha=1; }
function axes(x0,y0,x1,y1){ line([[x0,y1],[x0,y0],[x1,y0]],'rgba(242,238,227,.4)',1.2); }
function arrowArc(x,y,r,a0,a1,col,w){
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=w;
  ctx.beginPath(); ctx.arc(x,y,r,a0,a1); ctx.stroke();

function loop(now){

  if (playing) T=(T+dt)%TOTAL;

}
resize();
requestAnimationFrame(loop);
})();

<script>
/* ---------- part 2: the score ----------
   A synth score built live with the Web Audio API: wide analog pads, a Berlin-school
   sequencer that speeds up, glass bells, data blips, a music box, a recurring theme.
   Scene 1 opens in 1750 on a harpsichord; the synths take over at the time jump.
   Put a file at music/soundtrack.mp3 or press the note button to play your own. */
(() => {
'use strict';
const H=window.asi;
if (!H) return;
const DUR=H.DUR;
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

  Am:[33,45,52,57,60,64], Asus2:[33,45,52,57,59,64],
  F:[29,41,48,53,57,60], Fmaj7:[29,41,48,52,57,60],
  C:[36,48,55,60,64,67], G:[31,43,50,55,59,62],
  Em:[28,40,47,52,55,59], E:[28,40,47,52,56,59], Esus:[28,40,47,52,57,59],
  Dm:[26,38,45,50,53,57],
};
const BEAT=.6; // 100 bpm: 20 beats per scene
/* the theme ([midi, beats]) and its major-key twin */
const THEME=[[76,1],[72,1],[76,2],[79,2],[77,1],[76,1],[72,2],[69,2],[71,2],[72,4]];
const THEME_MAJ=[[79,1],[76,1],[79,2],[84,2],[81,1],[79,1],[76,2],[72,2],[74,2],[76,4]];
const up=(notes,d)=>notes.map(([m,b])=>[m+d,b]);
const RISE=[57,60,64,67,69,72,76,79,84].map(m=>[m,1]);
/* per scene: ch/i chords + intensity | pluck harpsichord | seq baseline | kick |
   bells / box (music box) / blips | lead melody | swell+boom | boom alone */
const SCORE=[
  { ch:['Fmaj7','Am'], from:.44, i:[.3,.55], pluck:[['Am','Dm','E','Am'],0,.42], bells:.4, boom:[.44] },
  { ch:['Am','F','C','G'], i:[.35,.65], seq:[.75,.04,1,1,4] },
  { ch:['Am','F','C','G'], i:[.35,.5], seq:[.4,0,1,2,2], lead:{from:.08,notes:THEME,vol:.5} },
  { ch:['Asus2','Fmaj7','Am'], i:[.25,.6], bells:.6, swell:[.6] },
  { ch:['C','G','Am','F'], i:[.4,.5], seq:[.5,0,1,4,4], blips:[.85,.08,1] },
  { ch:['Em','C'], i:[.2,.32], bells:.4, blips:[.5,0,.4], box:[.55,1] },
  { ch:['Am','F','C','Esus'], i:[.45,.7], seq:[.7,0,1,4,4], kick:[.5,1,2,.6] },
  { ch:['Dm','Am','F','C'], i:[.45,.6], seq:[.6,0,1,4,4], blips:[.6,0,1], kick:[.55,.85,1,.7] },
  { ch:['Am','G','F','E'], i:[.55,.72], seq:[.9,0,1,4,6], kick:[0,1,1,.8] },
  { ch:['Fmaj7','Am','F','Esus'], i:[.3,.65], lead:{from:.08,notes:RISE,vol:.55}, bells:.2, swell:[.72] },
  { ch:['Am','F','C','G'], i:[.5,1], seq:[1,0,.96,2,8], kick:[.3,.96,1,1], swell:[.6] },
  { ch:['Dm','Am'], i:[.3,.45], kick:[.1,.86,2,.5], bells:.25, boom:[.86] },
  { ch:['F','C','G','Am'], i:[.4,.55], seq:[.5,0,1,4,4], bells:.3 },
  { ch:['C','G','Am','Em'], i:[.4,.45], lead:{from:.08,notes:THEME_MAJ,vol:.55} },

];

const EV=[];

    const c=chordAt(t);

  });

/* ---------- synthesis ---------- */
let ac=null,master,comp,revIn,bus=null,dsend=null,noise;

}
function newBus(){
  if (bus){ const old=bus; old.gain.setTargetAtTime(0,ac.currentTime,.06); setTimeout(()=>old.disconnect(),800); }

  dl.delayTime.value=BEAT*.75; fb.gain.value=.38; lp.type='lowpass'; lp.frequency.value=2600;

function osc(type,f,t,end,dest,gain=1,detune=0){
  const o=ac.createOscillator(); o.type=type; o.frequency.value=f; o.detune.value=detune;
  let node=o;

  node.connect(dest); o.start(t); o.stop(end);

}

  const g=ac.createGain(); g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(peak,t+atk); g.gain.setTargetAtTime(0,t+atk,decay);
  return g;
}
function lowpass(f,q=1){ const b=ac.createBiquadFilter(); b.type='lowpass'; b.frequency.value=f; b.Q.value=q; return b; }

function pad(e,t,dur,atk){

  lp.frequency.linearRampToValueAtTime(500+1500*inten,t+dur);
  const lfo=ac.createOscillator(), lg=ac.createGain();
  lfo.frequency.value=.17; lg.gain.value=150+250*inten; lfo.connect(lg); lg.connect(lp.frequency); lfo.start(t); lfo.stop(end);
  const g=ac.createGain(); g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(1,t+atk); g.gain.setValueAtTime(1,t+dur); g.gain.setTargetAtTime(0,t+dur,.8);
  lp.connect(g); g.connect(bus);
  const v=.014*(.5+inten);
  e.ch.slice(1).forEach((m,k)=>{
    const f=freq(m);
    osc('sawtooth',f,t,end,lp,v,-8+k);
    osc('sawtooth',f,t,end,lp,v,8-k);
  });
  const fb=freq(e.ch[0]);
  osc('sine',fb,t,end,g,v*5);
  osc('sawtooth',fb*2,t,end,lp,v*.9);
}
function seq(e,t){
  const lp=lowpass(400,9);
  lp.frequency.setValueAtTime(500+2200*(.4+.6*e.bright)*e.vol,t); lp.frequency.exponentialRampToValueAtTime(160,t+.16);
  const g=env(t,.1*e.vol,.004,.07);
  lp.connect(g); g.connect(bus);
  const f=freq(e.m);
  osc('sawtooth',f,t,t+.45,lp,1,-5);
  osc('square',f/2,t,t+.45,lp,.5);
}
function pluck(e,t){
  const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=220;
  const lp=lowpass(5200);
  const g=env(t,.07*e.vol,.002,.2);
  hp.connect(lp); lp.connect(g); g.connect(bus); g.connect(dsend);
  const f=freq(e.m);
  osc('sawtooth',f,t,t+1.2,hp,.6);
  osc('square',f*2,t,t+1.2,hp,.22,4);
}
function bell(e,t){
  const f=freq(e.m);
  const g=env(t,(e.box?.045:.05)*e.vol,.005,e.box?.5:1); g.connect(bus); g.connect(dsend);
  osc('sine',f,t,t+(e.box?2:5),g);
  const g2=env(t,(e.box?.01:.016)*e.vol,.003,.25); g2.connect(bus);
  osc('sine',f*3.5,t,t+2,g2);
}
function blip(e,t){
  const lp=lowpass(4500);
  const g=env(t,.028*e.vol,.002,.03);
  lp.connect(g); g.connect(bus); g.connect(dsend);
  osc('square',freq(e.m),t,t+.2,lp);
}
function lead(e,t){
  const end=t+e.dur+1.5;
  const lp=lowpass(1400+1400*e.vol,2);
  const g=ac.createGain(); g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.06*e.vol,t+.07); g.gain.setValueAtTime(.06*e.vol,t+e.dur-.05); g.gain.setTargetAtTime(0,t+e.dur-.05,.18);
  lp.connect(g); g.connect(bus); g.connect(dsend);
  const vib=ac.createOscillator(), vg=ac.createGain();
  vib.frequency.value=5.2; vg.gain.setValueAtTime(0,t); vg.gain.linearRampToValueAtTime(9,t+Math.min(.6,e.dur)); vib.connect(vg); vib.start(t); vib.stop(end);
  const f=freq(e.m);
  for (const [type,d,gn] of [['sawtooth',-6,.7],['sawtooth',6,.7],['triangle',0,1]]){
    const o=osc(type,f,t,end,lp,gn,d); vg.connect(o.detune);
  }
}
function kick(e,t){
  const o=ac.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(42,t+.14);
  const g=env(t,.32*e.vol,.003,.14); o.connect(g); g.connect(master); o.start(t); o.stop(t+1);
}
function swell(e,t){
  const end=t+e.dur+2;
  const lp=lowpass(250,3);
  lp.frequency.setValueAtTime(250,t); lp.frequency.exponentialRampToValueAtTime(3200,t+e.dur);
  lp.frequency.setTargetAtTime(600,t+e.dur,.5);
  const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.03,t+e.dur); g.gain.setTargetAtTime(0,t+e.dur,.6);
  lp.connect(g); g.connect(bus);
  for (const m of [e.ch[0]+12,...e.ch.slice(2)]) for (const d of [-10,0,10]) osc('sawtooth',freq(m),t,end,lp,1,d);
}
function boom(t){
  const o=ac.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(75,t); o.frequency.exponentialRampToValueAtTime(26,t+2.2);
  const g=env(t,.45,.01,1.1); o.connect(g); g.connect(bus); o.start(t); o.stop(t+5);
  const s=ac.createBufferSource(); s.buffer=noise;
  const nl=lowpass(900);
  const ng=env(t,.14,.005,.7); s.connect(nl); nl.connect(ng); ng.connect(bus); s.start(t,0,2.9);
}
function riser(e,t){
  const s=ac.createBufferSource(); s.buffer=noise;
  const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2;
  bp.frequency.setValueAtTime(250,t); bp.frequency.exponentialRampToValueAtTime(5000,t+e.dur);
  const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.2,t+e.dur); g.gain.linearRampToValueAtTime(0,t+e.dur+.06);
  s.connect(bp); bp.connect(g); g.connect(bus); s.start(t,0,e.dur+.1);
}
function playE(e,t){
  switch (e.type){
    case 'pad': pad(e,t,e.dur,e.atk); break;
    case 'seq': seq(e,t); break;
    case 'pluck': pluck(e,t); break;
    case 'bell': bell(e,t); break;
    case 'blip': blip(e,t); break;
    case 'lead': lead(e,t); break;
    case 'kick': kick(e,t); break;
    case 'swell': swell(e,t); break;
    case 'boom': boom(t); break;
    case 'riser': riser(e,t); break;
  }
}

/* ---------- sync with the animation ---------- */
const LOOK=.3;
let anchor=0,idx=0;
function reset(T){
  newBus();
  anchor=ac.currentTime-T;
  idx=EV.findIndex(e=>e.t>=T); if (idx<0) idx=EV.length;
  for (let k=idx-1;k>=0;k--){
    const e=EV[k];
    if (e.type!=='pad') continue;
    if (e.t+e.dur>T+.3) pad(e,ac.currentTime+.02,e.t+e.dur-T,.5);
    break;
  }
}
function schedule(T){
  const drift=ac.currentTime-anchor-T;
  if (Math.abs(drift)>.04) anchor=ac.currentTime-T;
  while (idx<EV.length && EV[idx].t<T+LOOK){
    const e=EV[idx++], at=anchor+e.t;
    if (at<ac.currentTime-.05 && e.type!=='pad' && e.type!=='boom' && e.type!=='swell') continue;
    playE(e,Math.max(at,ac.currentTime+.005));
  }
}

const track=$('track'),tagEl=$('music-tag'),muteBtn=$('mute'),ownBtn=$('own'),ownFile=$('own-file');
track.addEventListener('loadedmetadata',()=>{ fileOk=true; if (!ownUrl&&started) setMode('file'); });
track.addEventListener('error',()=>{ fileOk=false; if (mode==='file') setMode('synth'); });

let started=false,lastT=H.T,lastWall=performance.now()/1000,wasPlaying=H.playing;
function setMode(m){
  mode=m;
  ownBtn.classList.toggle('active',m==='file');
  ownBtn.setAttribute('aria-label',m==='file'?'Return to the built-in score':'Choose your own music file');
  ownBtn.title=ownBtn.getAttribute('aria-label');
  if (!ac) return;
  if (m==='file'){
    if (bus) newBus();
    master.gain.setTargetAtTime(0,ac.currentTime,.05);
    track.currentTime=track.duration?H.T%track.duration:0;
    track.muted=muted;
    if (H.playing) track.play().catch(()=>{});
    const name=ownUrl?ownFile.files[0].name.replace(/\.[^.]+$/,''):'soundtrack';
    tagEl.textContent='\u266a '+name;
  } else {
    track.pause();
    master.gain.setTargetAtTime(muted?0:.9,ac.currentTime,.05);
    reset(H.T);
    tagEl.textContent='\u266a live synth score';
  }
}
let locked=false;
function start(){
  if (started) return;
  started=true;
  initAudio();
  if (track.readyState>=1 && !track.error) fileOk=true;
  setMode(fileOk?'file':'synth');
  if (!H.playing){ ac.suspend(); return; }
  ac.resume().catch(()=>{});
  setTimeout(()=>{ if (ac.state!=='running') locked=true; },300);
}
function unlock(e){
  if (!locked) return;
  locked=false;
  ac.resume().then(()=>{ if (mode==='file') setMode('file'); else reset(H.T); }).catch(()=>{});
  if (e.type==='keydown' ? e.code==='Space' : !e.target.closest('#controls')){
    e.preventDefault(); e.stopImmediatePropagation();
    if (e.type==='pointerdown') window.addEventListener('click',ev=>ev.stopImmediatePropagation(),{capture:true,once:true});
  }
}
window.addEventListener('pointerdown',unlock,true);
window.addEventListener('keydown',unlock,true);
window.addEventListener('keydown',e=>{ if (e.key==='m'||e.key==='M') toggleMute(); });
start();

function toggleMute(){
  muted=!muted;
  muteBtn.classList.toggle('off',muted);
  muteBtn.setAttribute('aria-label',muted?'Unmute music':'Mute music');
  muteBtn.title=muted?'Unmute music (M)':'Mute music (M)';
  track.muted=muted;
  if (ac&&mode==='synth') master.gain.setTargetAtTime(muted?0:.9,ac.currentTime,.08);
}
muteBtn.addEventListener('click',toggleMute);
ownBtn.addEventListener('click',()=>{
  if (mode==='file'){ setMode('synth'); return; }
  ownFile.click();
});
ownFile.addEventListener('change',()=>{
  const f=ownFile.files[0]; if (!f) return;
  if (ownUrl) URL.revokeObjectURL(ownUrl);
  ownUrl=URL.createObjectURL(f);
  track.src=ownUrl;
  track.addEventListener('loadedmetadata',()=>setMode('file'),{once:true});
});

document.addEventListener('visibilitychange',()=>{
  if (!ac) return;
  if (document.hidden){ ac.suspend(); track.pause(); }
  else if (H.playing){ ac.resume(); if (mode==='file') track.play().catch(()=>{}); }
});

setInterval(()=>{
  const T=H.T, playing=H.playing, wall=performance.now()/1000;
  const expected=lastT+(wasPlaying?wall-lastWall:0);
  const jumped=Math.abs(T-expected)>.45;
  if (ac && !document.hidden){
    if (playing!==wasPlaying){
      if (playing){ ac.resume(); if (mode==='file') track.play().catch(()=>{}); }
      else { ac.suspend(); track.pause(); }
    }
    if (mode==='file'){
      if (jumped && track.duration) track.currentTime=T%track.duration;
    } else if (playing||jumped){
      if (jumped) reset(T);
      if (playing && ac.state==='running') schedule(T);
    }
  }
  lastT=T; lastWall=wall; wasPlaying=playing;
},50);
})();
</script>
</body>
